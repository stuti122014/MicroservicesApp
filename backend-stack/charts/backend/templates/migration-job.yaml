{{- if .Values.migration.enabled }}

apiVersion: batch/v1
kind: Job

metadata:
  name: {{ include "backend.fullname" . }}-migration

  labels:
    {{- include "backend.labels" . | nindent 4 }}

  # annotations:
  #   "helm.sh/hook": post-install,post-upgrade
  #   "helm.sh/hook-weight": "5"
  #   "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
        azure.workload.identity/use: "true"

    spec:
      restartPolicy: Never

      serviceAccountName: {{ .Values.global.workloadIdentity.serviceAccountName | default "backend-workload-identity" }}

      containers:
        - name: migration

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: DB_HOST
              value: "{{ .Release.Name }}-postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.databaseSecretName" . }}
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.databaseSecretName" . }}
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.databaseSecretName" . }}
                  key: DB_PASSWORD

            - name: FRONTEND_ORIGIN
              value: {{ .Values.frontendOrigin | quote }}

{{- end }}