---
# Source: backend-stack/charts/backend/templates/migration-job.yaml
apiVersion: batch/v1
kind: Job

metadata:
  name: backend-stack-backend-migration

  labels:
    app.kubernetes.io/name: backend
    
    app.kubernetes.io/instance: backend-stack
    
    app.kubernetes.io/component: backend
    
    app.kubernetes.io/managed-by: Helm

  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        
        app.kubernetes.io/instance: backend-stack
        
        app.kubernetes.io/component: backend
        azure.workload.identity/use: "true"

    spec:
      restartPolicy: Never

      serviceAccountName: backend-workload-identity

      containers:
        - name: migration

          image: "devnitoracr001.azurecr.io/backendimage:v1.0.1"

          imagePullPolicy: IfNotPresent

          env:
            - name: DB_HOST
              value: "backend-stack-postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-stack-database-secrets
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-stack-database-secrets
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-stack-database-secrets
                  key: DB_PASSWORD

            - name: FRONTEND_ORIGIN
              value: "http://6weathers.com"
