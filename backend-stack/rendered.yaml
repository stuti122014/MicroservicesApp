# Source: backend-stack/charts/backend/templates/deployment.yaml
apiVersion: apps/v1

kind: Deployment

metadata:
  name: backend-stack-backend

  labels:
    app.kubernetes.io/name: backend
    
    app.kubernetes.io/instance: backend-stack
    
    app.kubernetes.io/component: backend
    
    app.kubernetes.io/managed-by: Helm

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      
      app.kubernetes.io/instance: backend-stack
      
      app.kubernetes.io/component: backend

  template:

    metadata:
      labels:
        app.kubernetes.io/name: backend
        
        app.kubernetes.io/instance: backend-stack
        
        app.kubernetes.io/component: backend
        azure.workload.identity/use: "true"

    spec:

      serviceAccountName: backend-workload-identity

      containers:

        - name: backend

          image: "devnitoracr001.azurecr.io/backendimage:v1.0.1"

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:

            - name: DB_HOST
              value: "backend-stack-postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-stack-database-secrets
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-stack-database-secrets
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-stack-database-secrets
                  key: DB_PASSWORD

            - name: FRONTEND_ORIGIN
              value: "http://6weathers.com"

          volumeMounts:

            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:

        - name: secrets-store

          csi:
            driver: secrets-store.csi.k8s.io

            readOnly: true

            volumeAttributes:
              secretProviderClass: backend-stack-azure-keyvault
---
# Source: backend-stack/charts/postgres/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-stack-postgres
  labels:
    app.kubernetes.io/name: postgres
    
    app.kubernetes.io/instance: backend-stack
    
    app.kubernetes.io/component: postgres
    
    app.kubernetes.io/managed-by: Helm

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      
      app.kubernetes.io/instance: backend-stack
      
      app.kubernetes.io/component: postgres

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        
        app.kubernetes.io/instance: backend-stack
        
        app.kubernetes.io/component: postgres
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: backend-workload-identity

      containers:
        - name: postgres

          image: "postgres:16-alpine"

          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            # PostgreSQL data directory
            # PVC is mounted at /var/lib/postgresql/data
            # PGDATA uses a subdirectory to avoid lost+found issue
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: backend-stack-database-secrets
                  key: DB_NAME

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backend-stack-database-secrets
                  key: DB_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-stack-database-secrets
                  key: DB_PASSWORD

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: backend-stack-postgres-data

        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-stack-azure-keyvault
---
# Source: backend-stack/charts/backend/templates/ingress.yaml
apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:

  name: backend-stack-backend

  labels:
    app.kubernetes.io/name: backend
    
    app.kubernetes.io/instance: backend-stack
    
    app.kubernetes.io/component: backend
    
    app.kubernetes.io/managed-by: Helm

  annotations:

    nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:

  ingressClassName: nginx

  rules:

    - host: api.6weathers.com

      http:

        paths:

          - path: /api(/|$)(.*)

            pathType: ImplementationSpecific

            backend:

              service:

                name: backend-stack-backend

                port:

                  number: 80
---
# Source: backend-stack/templates/secretproviderclass.yaml
apiVersion: secrets-store.csi.x-k8s.io/v1

kind: SecretProviderClass

metadata:

  name: backend-stack-azure-keyvault

  labels:
    app.kubernetes.io/name: backend-stack
    
    app.kubernetes.io/instance: backend-stack
    
    app.kubernetes.io/managed-by: Helm
    
    helm.sh/chart: backend-stack-0.1.0

spec:

  provider: azure

  parameters:

    usePodIdentity: "false"

    clientID: "9b987d8d-34ec-4f3d-be85-97472d9ce3b6"

    keyvaultName: "nitorkeyvalultdev"

    tenantId: "03d9c571-f4cd-41f4-a17b-b7880f23e331"

    cloudName: AzurePublicCloud

    objects: |
      array:

        - |
          objectName: DB-USERNAME
          objectType: secret
          objectVersion: ""

        - |
          objectName: DB-PASSWORD
          objectType: secret
          objectVersion: ""

        - |
          objectName: DB-NAME
          objectType: secret
          objectVersion: ""

  secretObjects:

    - secretName: backend-stack-database-secrets

      type: Opaque

      data:

        - objectName: DB-USERNAME
          key: DB_USER

        - objectName: DB-PASSWORD
          key: DB_PASSWORD

        - objectName: DB-NAME
          key: DB_NAME
