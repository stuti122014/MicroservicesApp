apiVersion: secrets-store.csi.x-k8s.io/v1

kind: SecretProviderClass

metadata:

  name: {{ include "backend-stack.secretProviderClassName" . }}

  labels:
    {{- include "backend-stack.labels" . | nindent 4 }}

spec:

  provider: azure

  parameters:

    usePodIdentity: "false"

    clientID: {{ .Values.azure.workloadIdentity.clientId | quote }}

    keyvaultName: {{ .Values.azure.keyVault.name | quote }}

    tenantId: {{ .Values.azure.workloadIdentity.tenantId | quote }}

    cloudName: AzurePublicCloud

    objects: |
      array:

        - |
          objectName: {{ .Values.azure.keyVault.secrets.dbUsername }}
          objectType: secret
          objectVersion: ""

        - |
          objectName: {{ .Values.azure.keyVault.secrets.dbPassword }}
          objectType: secret
          objectVersion: ""

        - |
          objectName: {{ .Values.azure.keyVault.secrets.dbName }}
          objectType: secret
          objectVersion: ""

  secretObjects:

    - secretName: {{ include "backend-stack.secretName" . }}

      type: Opaque

      data:

        - objectName: {{ .Values.azure.keyVault.secrets.dbUsername }}
          key: DB_USER

        - objectName: {{ .Values.azure.keyVault.secrets.dbPassword }}
          key: DB_PASSWORD

        - objectName: {{ .Values.azure.keyVault.secrets.dbName }}
          key: DB_NAME