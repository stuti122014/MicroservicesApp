name: Deploy ENV based Microservices
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  id-token: write
  contents: read

env:
  HELM_RELEASE: backend-stack
  CHART_PATH: ./backend-stack

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      # -----------------------------
      # Checkout repository
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # Azure Login
      # -----------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # -----------------------------
      # Set Namespace
      # -----------------------------
      - name: Set Namespace
        run: |
          echo "NAMESPACE=backend-${{ inputs.environment }}" >> $GITHUB_ENV

      # -----------------------------
      # AKS Credentials
      # -----------------------------
      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group dev-nitor-rg-002 \
            --name dev-nitor-cluster-01 \
            --overwrite-existing

      # -----------------------------
      # Setup Helm
      # -----------------------------
      - name: Setup Helm
        uses: azure/setup-helm@v4

      # -----------------------------
      # Helm Dependencies
      # -----------------------------
      - name: Update Helm dependencies
        working-directory: backend-stack
        run: |
          helm dependency update .

      # -----------------------------
      # Helm Lint
      # -----------------------------
      - name: Helm lint
        working-directory: backend-stack
        run: |
          helm lint . -f values/${{ inputs.environment }}-values.yaml

      # -----------------------------
      # Uninstall Previous Release
      # -----------------------------
      - name: Uninstall previous Helm release
        run: |
          helm uninstall $HELM_RELEASE \
            --namespace $NAMESPACE \
            --wait || true

      # -----------------------------
      # Deploy Application
      # -----------------------------
      - name: Deploy Helm chart
        working-directory: ${{ env.CHART_PATH }}
        run: |
          helm upgrade --install $HELM_RELEASE . \
            --namespace $NAMESPACE \
            --create-namespace \
            -f values/${{ inputs.environment }}-values.yaml \
            --wait \
            --timeout 10m

      # -----------------------------
      # Deployment Status
      # -----------------------------
      - name: Check deployment
        run: |
          echo "Namespace: $NAMESPACE"
          echo "Release: $HELM_RELEASE"

          kubectl get pods -n $NAMESPACE
          kubectl get svc -n $NAMESPACE
          kubectl get ingress -n $NAMESPACE
